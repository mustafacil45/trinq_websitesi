<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="trinQ">
  <!--
    apple-touch-icon kaynağı. favicon.svg ile aynı mark, iki farkla:
    - köşeler YUVARLATILMAZ: iOS kendi maskesini uyguluyor, yuvarlak köşeli
      bir görsel verirsek köşeler iki kez kırpılıp beyaz kenar bırakıyor.
    - zemin tam dolu (saydamlık yok), iOS saydam pikselleri siyaha çeviriyor.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16452f" />
      <stop offset="1" stop-color="#0c251e" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="url(#bg)" />

  <g fill="none" stroke-linecap="round">
    <circle cx="30" cy="29.5" r="15" stroke="#fdf8ec" stroke-width="8.5" />
    <path d="M34.5 34 L49 48.5" stroke="#e3c779" stroke-width="8" />
  </g>
</svg>
